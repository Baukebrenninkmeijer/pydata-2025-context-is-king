[project]
name = "pydata-2025-context-is-king"
version = "0.1.0"
description = "Context Is King - PyData 2025 Research Project comparing RAG vs Long Context Windows"
authors = [
    {name = "Research Team", email = "research@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core ML/NLP
    "torch>=2.0.0",
    "sentence-transformers>=2.2.2",
    "transformers>=4.30.0",
    "tiktoken>=0.4.0",
    # Vector Database
    "chromadb>=0.4.0",
    # Text Processing
    "langchain>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    # Data Processing
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "numpy>=1.24.0",
    # API Clients
    "openai>=1.10.0",
    "httpx>=0.24.0",
    "tenacity>=8.2.0",
    # Configuration & Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "altair>5.4.0",
    "vegafusion>=2.0.2",
    "vl-convert-python>=1.6.0",
    "dotenv>=0.9.9",
    "anthropic>=0.64.0",
    "voyageai>=0.3.4",
    "matplotlib>=3.10.5",
    "langchain-ollama>=0.3.6",
    "peft>=0.17.0",
    "langchain-nvidia-ai-endpoints>=0.3.16",
    "loguru>=0.7.3",
    "ollama>=0.5.3",
    "sentence-transformers>=2.2.0",
    "more-itertools>=10.7.0",
    "beautifulsoup4>=4.13.4",
    "deltalake>=1.1.4",
    "asyncio-throttle>=1.0.2",
    "rouge-score>=0.1.2",
    "langchain-openai>=0.3.32",
    "plotly>=6.3.0",
    "seaborn>=0.13.2",
    "retry>=0.9.2",
    "aiofiles>=24.1.0",
    "nbformat>=5.10.4",
    "pypdf>=6.0.0",
    "cryptography>=45.0.7",
    "pyarrow>=21.0.0",
    "jsonref>=1.1.0",
    "qrcode[pil]>=8.2",
    "segno>=1.6.6",
    "jupyter-cache>=1.0.1",
    "jupyter>=1.1.1",
    "kaleido>=1.1.0",
    "statsmodels>=0.14.5",
    "qrcode-artistic>=3.0.2",
    "py2puml>=0.10.0",
]

[project.scripts]
ck-generate-queries = "context_is_king.cli.generate_wikitext_queries:main"
ck-generate-queries-v2 = "context_is_king.cli.generate_wikitext_queries_v2:main"
ck-ingest-chroma = "context_is_king.data_ingestion.chroma_ingestion:main"
ck-ingest-data = "context_is_king.data_ingestion.data_ingestion:main"
ck-download-datasets = "context_is_king.data_ingestion.dataset_downloader:main"
ck-extract-longmemeval = "context_is_king.cli.extract_longmemeval_ground_truth:main"
ck-run-context-experiment = "context_is_king.experiments.context_window_scaling.run_experiment:main"
ck-run-context-advantage = "context_is_king.experiments.context_advantage.context_advantage_experiment:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_is_king"]

[tool.ruff]
line-length = 120
target-version = "py310"
lint.select = ['E', 'F', 'W', 'FAST', 'ANN', 'ASYNC', 'S', 'FBT', 'B', 'A', 'DTZ', 'INT', 'ISC', 'LOG', 'ICN', 'G', 'INP', 'PIE', 'T20', 'PYI', 'PT', 'Q', 'RSE', 'RET', 'SLF', 'SIM', 'TID', 'TC', 'ARG', 'PTH', 'FLY', 'I', 'C90', 'NPY', 'PD', 'N', 'PERF', 'DOC', 'UP', 'FURB', 'RUF', 'TRY']
lint.ignore = ['G001', 'G002', 'Q000', 'TRY003', 'RET503']


[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
]
